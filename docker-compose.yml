version: '3.8'

services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2_performance_test
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=db2admin123
      - DBNAME=LOANDB
      - ARCHIVE_LOGS=false
      - AUTOCONFIG=false
    volumes:
      - db2_data:/database
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/scripts:/scripts
    networks:
      - db2_network
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to LOANDB"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db2_data:
    driver: local

networks:
  db2_network:
    driver: bridge
